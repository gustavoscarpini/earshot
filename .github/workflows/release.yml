name: Release

# Builds and publishes Earshot when a version tag (v0.1.0, v1.2.3, ...) is
# pushed. Without signing secrets the app is ad-hoc signed and not notarized;
# once the Developer ID secrets exist (README › Releases) it is signed and
# notarized instead.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: |
          xcodebuild test \
            -project Earshot.xcodeproj \
            -scheme Earshot \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Developer ID certificate
        if: env.TEAM_ID != ''
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          if [ -n "$TEAM_ID" ]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          fi
          Scripts/package-release.sh
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          if [ -z "$TEAM_ID" ]; then
            cat > "$NOTES" <<'EOF'
          > [!IMPORTANT]
          > This build is **not notarized**. After moving `Earshot.app` to `/Applications`, open it once, then go to **System Settings › Privacy & Security** and click **Open Anyway**. See the [README](https://github.com/gustavoscarpini/earshot#download).
          EOF
          else
            : > "$NOTES"
          fi
          gh release create "$GITHUB_REF_NAME" \
            build/release/Earshot-*.zip build/release/Earshot-*.zip.sha256 \
            --title "Earshot ${GITHUB_REF_NAME#v}" \
            --notes-file "$NOTES" \
            --generate-notes \
            --verify-tag

      - name: Remove signing keychain
        if: always() && env.TEAM_ID != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
